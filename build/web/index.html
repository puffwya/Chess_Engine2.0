<!DOCTYPE html>
<html>
<head>
    <style>
        #board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            width: 400px;
        }

        .sq {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        .light { background: #eee; }
        .dark { background: #600; color: white; }
    </style>
</head>
<body>

<div id="board"></div>

<div id="promotionMenu" style="
    display:none;
    position:absolute;
    top:50%; 
    left:50%;
    transform:translate(-50%, -50%);
    background:white;
    border:2px solid black;
    padding:10px;
    z-index:1000;
">
    <button onclick="choosePromotion(5)">Q</button>
    <button onclick="choosePromotion(4)">R</button>
    <button onclick="choosePromotion(3)">B</button>
    <button onclick="choosePromotion(2)">N</button>
</div>

<script src="chess_wasm.js"></script>
<script src="app.js"></script>

</body>
</html>
